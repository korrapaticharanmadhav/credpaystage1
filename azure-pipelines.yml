
pool:
  vmImage: 'ubuntu-latest'

variables:
  acrserviceconnection: 'acrserviceconnection'
  frontendrepository: 'credpay/frontend'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'

stages:
  - stage: dockerbuild
    displayName: 'Docker Build and Push'

    jobs:
      - job: buildpushimages
        displayName: 'Build and Push All Images'

        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Build and Push Frontend'
            inputs:
              containerRegistry: '$(acrserviceconnection)'
              repository: '$(frontendrepository)'
              command: 'buildAndPush'
              Dockerfile: 'frontend-react/Dockerfile'
              buildContext: 'frontend-react'
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: 'Build and Push User Service'
            inputs:
              containerRegistry: '$(acrserviceconnection)'
              repository: '$(userrepository)'
              command: 'buildAndPush'
              Dockerfile: 'user-service/Dockerfile'
              buildContext: 'user-service'
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: 'Build and Push Payment Service'
            inputs:
              containerRegistry: '$(acrserviceconnection)'
              repository: '$(paymentrepository)'
              command: 'buildAndPush'
              Dockerfile: 'payment-service/Dockerfile'
              buildContext: 'payment-service'
              tags: |
                $(tag)
                latest
